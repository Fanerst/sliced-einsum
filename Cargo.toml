[package]
name = "sliced-einsum"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Prototype of a sliced einsum (memory-capped plans with omeco's slicer) on tenferro, for tensor4all/tenferro-rs#2676"

# tenferro-rs main on 2026-11-22.
[dependencies]
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "c4db040073e0a2d952015f9c6723c61078935cfe" }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs", rev = "c4db040073e0a2d952015f9c6723c61078935cfe" }
tenferro-einsum = { git = "https://github.com/tensor4all/tenferro-rs", rev = "c4db040073e0a2d952015f9c6723c61078935cfe" }
omeco = "0.2.6"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
